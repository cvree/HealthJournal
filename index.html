<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: when the soft keyboard opens, the
         layout viewport shrinks with it, so a dvh-sized bottom sheet gets
         shorter and keeps its pinned Save above the keys instead of behind
         them. Chromium honours this; the visualViewport listener in App.tsx
         covers iOS Safari, which does not. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#141519" />
    <meta name="color-scheme" content="dark" />

    <!-- Theme, before anything paints. The saved preference lives in
         localStorage precisely so it can be read synchronously here; waiting
         for React would mean a white flash on every cold start in dark mode.
         src/lib/theme.ts owns the real palettes — this only needs the two
         ground colours to get the first frame right. -->
    <script>
      (function () {
        var pref = "dark";
        try {
          var saved = localStorage.getItem("fhj_theme_v1");
          if (saved === "light" || saved === "dark" || saved === "system") pref = saved;
        } catch (e) {}
        var theme = pref;
        if (pref === "system") {
          theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        root.style.setProperty("--fhj-bg", theme === "light" ? "#F4F1EB" : "#141519");
        root.style.setProperty("--fhj-sub", theme === "light" ? "#5A5E68" : "#ADAFB8");
      })();
    </script>

    <title>Bellwether</title>
    <meta
      name="description"
      content="A private symptom journal that lives on your device. Build a check-in around your own situation, bring in the notes you already keep elsewhere, watch trends over weeks, and print a summary for an appointment. No account, no tracking, nothing sent unless you switch it on. Not medical advice."
    />

    <!-- Link previews. og-image.png is generated at 1200x630 and ships with the app. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bellwether" />
    <meta property="og:title" content="Bellwether — the early sign, written down" />
    <meta
      property="og:description"
      content="A daily check-in built around your situation. Bring in the notes you already keep, watch the trends come out over weeks, print a summary for an appointment — with the journal itself kept on your own device."
    />
    <meta property="og:image" content="%SITE%%BASE%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bellwether — your health, in your own words. No account, no tracking, works offline." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bellwether — the early sign, written down" />
    <meta
      name="twitter:description"
      content="Private daily health tracking, kept on your own device. Bring in the notes you already keep. Not medical advice."
    />
    <meta name="twitter:image" content="%SITE%%BASE%og-image.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bellwether" />

    <!-- Rendered before React mounts so a slow first load on a phone shows the
         product's own surface rather than a white rectangle. Removed by main.tsx. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--fhj-bg, #0e1015);
        color: var(--fhj-sub, #9aa2b4);
        font: 500 17px/1.4 Georgia, "Times New Roman", serif;
        letter-spacing: 0.01em;
        transition: opacity 220ms ease;
      }
      #boot[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">Bellwether…</div>
    <noscript>
      <p style="padding: 2rem; font: 16px/1.5 system-ui, sans-serif; color: var(--fhj-sub, #9aa2b4)">
        Bellwether is a JavaScript app that runs entirely in your browser — there is no
        server to fall back to. Please enable JavaScript to use it.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
