name: Deploy to GitHub Pages

# Publishes the static build to GitHub Pages. Everything is client-side, so
# "deploying" is just uploading dist/ — there is no server, database, or secret
# involved, and the journal itself never leaves the visitor's device.
#
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Allow one concurrent deployment; a newer commit supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify before publishing
        run: npm run check

      - name: Resolve the Pages base path
        id: base
        # A project site lives at https://<owner>.github.io/<repo>/, a user or
        # custom-domain site at the root. `actions/configure-pages` reports the
        # real one, so the build is rebased correctly either way.
        #
        # enablement: true turns Pages on the first time this runs, instead of
        # failing with "Get Pages site failed" until someone visits Settings →
        # Pages by hand. It is a no-op on every run after that.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build for Pages
        env:
          BASE_PATH: ${{ steps.base.outputs.base_path || '/' }}
        run: |
          BASE_PATH="${BASE_PATH:-/}"
          echo "Building with base $BASE_PATH"
          BASE_PATH="$BASE_PATH" npm run build

      - name: Add SPA + Jekyll guards
        run: |
          # Pages runs Jekyll by default, which drops files starting with "_".
          touch dist/.nojekyll
          # Any unknown path boots the app instead of a 404 page.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
