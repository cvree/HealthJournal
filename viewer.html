<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1015" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />

    <!-- Same pre-paint theme resolution as index.html; the viewer shares the
         app's palette and remembers the same preference. -->
    <script>
      (function () {
        var pref = "dark";
        try {
          var saved = localStorage.getItem("fhj_theme_v1");
          if (saved === "light" || saved === "dark" || saved === "system") pref = saved;
        } catch (e) {}
        var theme = pref;
        if (pref === "system") {
          theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        root.style.setProperty("--fhj-bg", theme === "light" ? "#F6F7F9" : "#0E1015");
      })();
    </script>
    <title>Health Journal — backup viewer</title>
    <meta
      name="description"
      content="Read-only viewer for Health Journal backups. Open a .json backup to browse it on a bigger screen — the file stays in this browser tab and is never uploaded."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font: 16px/1.5 system-ui, sans-serif; color: var(--fhj-sub, #9aa2b4)">
        The backup viewer reads your file entirely in the browser, so it needs JavaScript enabled.
      </p>
    </noscript>
    <script type="module" src="/src/viewer.tsx"></script>
  </body>
</html>
